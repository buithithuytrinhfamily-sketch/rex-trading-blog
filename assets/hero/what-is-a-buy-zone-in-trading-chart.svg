b7e">A zone is a range of entries, so it is a range of risks. Size from the far edge and the ceiling holds wherever you fill.</text><text x="76.0" y="665.0" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a99b7e">Educational illustration of risk arithmetic, not a way to trade it.</text></svg>